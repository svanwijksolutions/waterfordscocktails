# ==========================================================================
# Sveltia CMS — configuratie voor Waterfords Cocktails
# ==========================================================================

backend:
  name: github
  repo: svanwijksolutions/waterfordscocktails
  branch: main
  base_url: https://waterfords-cms.sem-f7d.workers.dev
  commit_messages:
    create: 'Partner toegevoegd: {{slug}}'
    update: 'Partners bijgewerkt'
    delete: 'Partner verwijderd: {{slug}}'

logo_url: /assets/images/favicon.ico

site_url: https://waterfordscocktails.com/
display_url: https://waterfordscocktails.com/

media_folder: "assets/images/companys"
public_folder: "/assets/images/companys"

collections:
  - name: partners
    label: Partners & Retailers
    label_singular: Partner
    description: >
      Beheer hier alle partnerlogo's. Sleep een partner omhoog of omlaag om de volgorde
      te wijzigen — die volgorde is exact hoe ze op de website verschijnen.
      Op de homepage worden ALLE actieve partners getoond (scrollende balk).
      Op 'Waar te koop' worden maximaal 20 partners getoond.
      Na opslaan wordt de website automatisch bijgewerkt.
    files:
      - name: partners_lijst
        label: Partnerlijst
        file: content/partners.json
        fields:
          - label: "Partners"
            name: partners
            widget: list
            label_singular: "Partner"
            summary: "{{naam}}"
            minimize_collapsed: false
            fields:
              - label: "Naam"
                name: naam
                widget: string
                hint: "Volledige bedrijfsnaam, bijv. 'Jumbo' of 'De Wijnkooper'"

              - label: "Logo"
                name: logo
                widget: image
                hint: "Upload een SVG of transparante PNG."
                media_folder: "/assets/images/companys"
                public_folder: "/assets/images/companys"

              - label: "Website URL (optioneel)"
                name: url
                widget: string
                required: false
                hint: "Bijv. https://www.jumbo.com — logo wordt dan klikbaar."

              - label: "Zichtbaar op homepage"
                name: zichtbaar_homepage
                widget: boolean
                default: true
                hint: "Tonen in de scrollende balk op de homepage."

              - label: "Zichtbaar op 'Waar te koop'"
                name: zichtbaar_waar_te_koop
                widget: boolean
                default: true
                hint: "Tonen op de 'Waar te koop' pagina (max. 20)."