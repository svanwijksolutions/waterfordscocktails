<!-- components/header.html -->
<header class="site-header" id="site-header" role="banner">
  <div class="container">
    <div class="header-inner">

      <!-- Logo -->
      <a href="index.html" class="header-logo" aria-label="Waterfords Cocktails – Home">
        <img
          src="assets/images/logo.svg"
          alt="Waterfords Cocktails"
          width="186"
          height="66"
          loading="eager"
        />
      </a>

      <!-- Desktop navigation -->
      <nav class="nav-links" aria-label="Main navigation">
        <a href="index.html"        data-i18n="nav.home"     class="nav-link">Home</a>
        <a href="about.html"        data-i18n="nav.about"    class="nav-link">About Us</a>
        <a href="flavours.html"     data-i18n="nav.flavours" class="nav-link">Our Flavours</a>
        <a href="where-to-buy.html" data-i18n="nav.where"    class="nav-link">Where to Buy</a>
        <a href="contact.html"      data-i18n="nav.contact"  class="nav-link">Contact</a>
      </nav>

      <!-- Right side: language switcher + hamburger -->
      <div class="header-right">

        <!-- Language switcher (with SVG flags) -->
        <div class="lang-switcher" id="langSwitcher">
          <button
            class="lang-btn"
            id="langBtn"
            aria-haspopup="listbox"
            aria-expanded="false"
            aria-label="Select language"
            type="button"
          >
            <span class="flag-icon" id="currentFlag" aria-hidden="true">
              <!-- UK flag -->
              <svg viewBox="0 0 60 30" xmlns="http://www.w3.org/2000/svg">
                <clipPath id="t-en"><path d="M30,15 h30 v15 z v15 h-30 z h-30 v-15 z v-15 h30 z"/></clipPath>
                <path d="M0,0 v30 h60 v-30 z" fill="#012169"/>
                <path d="M0,0 L60,30 M60,0 L0,30" stroke="#fff" stroke-width="6"/>
                <path d="M0,0 L60,30 M60,0 L0,30" clip-path="url(#t-en)" stroke="#C8102E" stroke-width="4"/>
                <path d="M30,0 v30 M0,15 h60" stroke="#fff" stroke-width="10"/>
                <path d="M30,0 v30 M0,15 h60" stroke="#C8102E" stroke-width="6"/>
              </svg>
            </span>
            <span id="currentLangLabel" class="lang-label">EN</span>
            <span class="chevron" aria-hidden="true">▾</span>
          </button>

          <div class="lang-dropdown" id="langDropdown" role="listbox" aria-label="Languages">
            <div class="lang-option active" role="option" data-lang="en" tabindex="0" aria-selected="true">
              <span class="flag-icon" aria-hidden="true">
                <svg viewBox="0 0 60 30" xmlns="http://www.w3.org/2000/svg">
                  <clipPath id="t-en-d"><path d="M30,15 h30 v15 z v15 h-30 z h-30 v-15 z v-15 h30 z"/></clipPath>
                  <path d="M0,0 v30 h60 v-30 z" fill="#012169"/>
                  <path d="M0,0 L60,30 M60,0 L0,30" stroke="#fff" stroke-width="6"/>
                  <path d="M0,0 L60,30 M60,0 L0,30" clip-path="url(#t-en-d)" stroke="#C8102E" stroke-width="4"/>
                  <path d="M30,0 v30 M0,15 h60" stroke="#fff" stroke-width="10"/>
                  <path d="M30,0 v30 M0,15 h60" stroke="#C8102E" stroke-width="6"/>
                </svg>
              </span>
              <span>English</span>
            </div>
            <div class="lang-option" role="option" data-lang="nl" tabindex="0" aria-selected="false">
              <span class="flag-icon" aria-hidden="true">
                <svg viewBox="0 0 9 6" xmlns="http://www.w3.org/2000/svg">
                  <rect width="9" height="2" fill="#AE1C28"/>
                  <rect y="2" width="9" height="2" fill="#FFFFFF"/>
                  <rect y="4" width="9" height="2" fill="#21468B"/>
                </svg>
              </span>
              <span>Nederlands</span>
            </div>
            <div class="lang-option" role="option" data-lang="de" tabindex="0" aria-selected="false">
              <span class="flag-icon" aria-hidden="true">
                <svg viewBox="0 0 5 3" xmlns="http://www.w3.org/2000/svg">
                  <rect width="5" height="1" fill="#000000"/>
                  <rect y="1" width="5" height="1" fill="#DD0000"/>
                  <rect y="2" width="5" height="1" fill="#FFCE00"/>
                </svg>
              </span>
              <span>Deutsch</span>
            </div>
          </div>
        </div>

        <!-- Hamburger (mobile only) -->
        <button
          class="menu-toggle"
          id="menuToggle"
          aria-label="Open menu"
          aria-expanded="false"
          aria-controls="mobileMenu"
          type="button"
        >
          <span></span>
          <span></span>
          <span></span>
        </button>

      </div>
    </div>
  </div>
</header>

<!-- Mobile menu overlay -->
<div class="mobile-menu" id="mobileMenu" role="dialog" aria-label="Mobile navigation" aria-modal="true">
  <nav aria-label="Mobile navigation links">
    <a href="index.html"        data-i18n="nav.home"     style="--i:1;">Home</a>
    <a href="about.html"        data-i18n="nav.about"    style="--i:2;">About Us</a>
    <a href="flavours.html"     data-i18n="nav.flavours" style="--i:3;">Our Flavours</a>
    <a href="where-to-buy.html" data-i18n="nav.where"    style="--i:4;">Where to Buy</a>
    <a href="contact.html"      data-i18n="nav.contact"  style="--i:5;">Contact</a>
  </nav>

  <div class="mobile-menu-bottom">
    <div class="mobile-lang">
      <button class="mobile-lang-btn active" data-lang="en" type="button">
        <span class="flag-icon" aria-hidden="true">
          <svg viewBox="0 0 60 30" xmlns="http://www.w3.org/2000/svg">
            <clipPath id="t-en-m"><path d="M30,15 h30 v15 z v15 h-30 z h-30 v-15 z v-15 h30 z"/></clipPath>
            <path d="M0,0 v30 h60 v-30 z" fill="#012169"/>
            <path d="M0,0 L60,30 M60,0 L0,30" stroke="#fff" stroke-width="6"/>
            <path d="M0,0 L60,30 M60,0 L0,30" clip-path="url(#t-en-m)" stroke="#C8102E" stroke-width="4"/>
            <path d="M30,0 v30 M0,15 h60" stroke="#fff" stroke-width="10"/>
            <path d="M30,0 v30 M0,15 h60" stroke="#C8102E" stroke-width="6"/>
          </svg>
        </span>
        EN
      </button>
      <button class="mobile-lang-btn" data-lang="nl" type="button">
        <span class="flag-icon" aria-hidden="true">
          <svg viewBox="0 0 9 6" xmlns="http://www.w3.org/2000/svg">
            <rect width="9" height="2" fill="#AE1C28"/>
            <rect y="2" width="9" height="2" fill="#FFFFFF"/>
            <rect y="4" width="9" height="2" fill="#21468B"/>
          </svg>
        </span>
        NL
      </button>
      <button class="mobile-lang-btn" data-lang="de" type="button">
        <span class="flag-icon" aria-hidden="true">
          <svg viewBox="0 0 5 3" xmlns="http://www.w3.org/2000/svg">
            <rect width="5" height="1" fill="#000000"/>
            <rect y="1" width="5" height="1" fill="#DD0000"/>
            <rect y="2" width="5" height="1" fill="#FFCE00"/>
          </svg>
        </span>
        DE
      </button>
    </div>
    <p class="mobile-menu-brand">Waterfords Cocktails</p>
  </div>
</div>
